
name: Workflow for app with artifacts and caching

on:
  push:
    branches: [main]

jobs:
  build:
    name: My build angular app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout process if code is pushed
        uses: actions/checkout@v7

      - name: Setup Node js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build the app
        run: npm run build

      - name: Save the build as an artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: angular-production-build
          path: dist/
          if-no-files-found: error
          retention-days: 7
